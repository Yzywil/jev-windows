name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0a1
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.3'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/release_check.py
      - run: uv build
      - run: uv run python scripts/checksums.py
      - name: Verify version tag and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(uv run python -c 'from jev_windows import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "v$VERSION"
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "Jev Windows $VERSION" --notes-file docs/RELEASE_NOTES.md

